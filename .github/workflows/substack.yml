name: Import Substack notes
on:
  # schedule paused: Substack's Cloudflare returns 403 to GitHub runners. Re-enable once the fetch path is decided.
  # schedule: [{ cron: '17 5 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: substack-import
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: site-v2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
        working-directory: site
      - run: node scripts/import-substack.mjs --write
        working-directory: site
        env:
          SUBSTACK_FEED_URL: https://ikigaicollective.substack.com/feed
      - name: Commit new notes
        run: |
          git add site/src/content/notes site/src/assets/covers
          git diff --cached --quiet && exit 0
          git config user.name "ikigai-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "content: import new Substack notes"
          git push origin HEAD:site-v2
